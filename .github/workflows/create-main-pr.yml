name: Create main pull request

on:
  pull_request:
    types: [opened]
    branches:
      - main

jobs:
  create-main-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Read tool versions
        id: versions
        run: |
          echo "pnpm=$(jq -r .pnpm tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r '.node | ltrimstr("v")' tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "bun=$(jq -r .bun tool-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm }}
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Install dependencies
        run: pnpm run install:frozen

      - name: Run CI
        run: pnpm run ci

      - name: Run check script
        run: ./tools/check.js

