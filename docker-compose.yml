services:
  kurage-minimum:
    hostname: kurage-minimum
    command: sleep infinity
    build:
      context: .
      dockerfile: docker/Dockerfile.minimum
      args:
        - WORKDIR=/workspaces/kurage
    working_dir: /workspaces/kurage
    volumes:
      - ./:/workspaces/kurage
    environment:
      - TZ=UTC
  kurage-develop:
    hostname: kurage-develop
    command: sleep infinity
    build:
      context: .
      dockerfile: docker/Dockerfile.develop
      args:
        - TTYD_VER=1.7.7
        - WORKDIR=/workspaces/kurage
    working_dir: /workspaces/kurage
    volumes:
      - ./:/workspaces/kurage
      - kurage_node_modules:/workspaces/kurage/node_modules
      - kurage_bun_cache:/root/.bun
    environment:
      - TZ=UTC
volumes:
  kurage_node_modules:
  kurage_bun_cache:
